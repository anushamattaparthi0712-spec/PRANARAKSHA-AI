
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   PRANARAKSHA AI - FRONTEND + FLASK CONNECTION
========================================================= */

/* ---------- RISK INPUTS ---------- */

const rainfall = document.getElementById("rainfall");
const slope = document.getElementById("slope");
const soil = document.getElementById("soil");
const population = document.getElementById("population");


function updateSliderValues(){

    document.getElementById("rainValue").innerText =
        rainfall.value + " mm";

    document.getElementById("slopeValue").innerText =
        slope.value + "°";

    document.getElementById("soilValue").innerText =
        soil.value + "%";

    document.getElementById("populationValue").innerText =
        population.value + "%";
}


rainfall.addEventListener("input", updateSliderValues);
slope.addEventListener("input", updateSliderValues);
soil.addEventListener("input", updateSliderValues);
population.addEventListener("input", updateSliderValues);


/* =========================================================
   RISK MAP
========================================================= */

const map = L.map("risk-map").setView(
    [17.0005, 81.8040],
    8
);


L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);


/* Prototype map locations */

const riskLocations = {

    red: {
        lat: 17.0005,
        lon: 81.8040,
        color: "#ef4444",
        radius: 22000,
        title: "HIGH RISK ZONE"
    },

    yellow: {
        lat: 16.998,
        lon: 81.78,
        color: "#facc15",
        radius: 16000,
        title: "MODERATE RISK ZONE"
    },

    green: {
        lat: 17.09,
        lon: 81.69,
        color: "#22c55e",
        radius: 12000,
        title: "LOWER RISK ZONE"
    }

};


let riskCircle = null;
let riskMarker = null;


/* ---------- SAFE RELOCATION ICON ---------- */

const safeIcon = L.divIcon({

    className: "safe-marker",

    html: `
        <div style="
            width:20px;
            height:20px;
            background:#22c55e;
            border:3px solid white;
            border-radius:50%;
            box-shadow:0 0 12px #22c55e;
        "></div>
    `,

    iconSize: [20,20],
    iconAnchor: [10,10]

});


/* Safe relocation hub */

L.marker(
    [17.07, 81.72],
    {
        icon: safeIcon
    }
)
.addTo(map)
.bindPopup(
    "<b>📍 Safe Relocation Hub</b><br>" +
    "Prototype safe-site location"
);


/* Safe Site B */

L.marker(
    [17.12, 81.76],
    {
        icon: safeIcon
    }
)
.addTo(map)
.bindPopup(
    "<b>📍 Safe Site B</b><br>" +
    "Prototype relocation location"
);


/* =========================================================
   UPDATE MAP
========================================================= */

function updateMap(selectedRisk = null){

    const selected =
        selectedRisk ||
        document.getElementById("riskSelector").value;

    const location =
        riskLocations[selected];

    if(!location){
        return;
    }


    if(riskCircle){
        map.removeLayer(riskCircle);
    }


    if(riskMarker){
        map.removeLayer(riskMarker);
    }


    riskCircle = L.circle(
        [
            location.lat,
            location.lon
        ],
        {
            color: location.color,
            fillColor: location.color,
            fillOpacity: 0.22,
            radius: location.radius,
            weight: 3
        }
    ).addTo(map);


    riskMarker = L.marker(
        [
            location.lat,
            location.lon
        ]
    ).addTo(map);


    riskMarker.bindPopup(

        "<b>PranaRaksha AI</b><br>" +

        location.title +

        "<br><br>" +

        "Prototype risk-zone visualization."

    );


    riskMarker.openPopup();


    map.setView(
        [
            location.lat,
            location.lon
        ],
        8
    );

}


/* =========================================================
   CONNECT TO PYTHON FLASK BACKEND
========================================================= */

async function calculateRisk(){

    const riskNumber =
        document.getElementById("riskNumber");

    const riskStatus =
        document.getElementById("riskStatus");

    const riskMessage =
        document.getElementById("riskMessage");


    /* Show processing state */

    riskNumber.innerText = "...";

    riskStatus.innerHTML =
        "🧠 ANALYZING...";

    riskStatus.style.background =
        "#123044";

    riskStatus.style.color =
        "#20dfd0";

    riskMessage.innerText =
        "PranaRaksha AI is analyzing the selected risk parameters...";


    /* Data sent to Python */

    const riskData = {

        rainfall: Number(rainfall.value),

        slope: Number(slope.value),

        soil: Number(soil.value),

        population: Number(population.value)

    };


    try{

        const response = await fetch(
            "/calculate-risk",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(riskData)
            }
        );


        if(!response.ok){

            throw new Error(
                "Backend response error"
            );

        }


        const result =
            await response.json();


        /* ---------- DISPLAY RISK ---------- */

        riskNumber.innerText =
            result.risk;


        /* ---------- HIGH RISK ---------- */

        if(result.color === "red"){

            riskStatus.innerHTML =
                "🔴 HIGH RISK";

            riskStatus.style.background =
                "#48171b";

            riskStatus.style.color =
                "#ff7777";


            riskMessage.innerText =
                "High-risk conditions detected. " +
                "Immediate monitoring and emergency " +
                "preparedness are recommended.";


            /* Update map */

            document.getElementById(
                "riskSelector"
            ).value = "red";

            updateMap("red");

        }


        /* ---------- MODERATE RISK ---------- */

        else if(result.color === "yellow"){

            riskStatus.innerHTML =
                "🟡 MODERATE RISK";

            riskStatus.style.background =
                "#4d4813";

            riskStatus.style.color =
                "#ffe66d";


            riskMessage.innerText =
                "Moderate risk conditions detected. " +
                "Continue monitoring rainfall and " +
                "terrain conditions.";


            document.getElementById(
                "riskSelector"
            ).value = "yellow";

            updateMap("yellow");

        }


        /* ---------- LOWER RISK ---------- */

        else{

            riskStatus.innerHTML =
                "🟢 LOWER RISK";

            riskStatus.style.background =
                "#123b29";

            riskStatus.style.color =
                "#55e69a";


            riskMessage.innerText =
                "Current prototype indicator shows " +
                "lower risk conditions.";


            document.getElementById(
                "riskSelector"
            ).value = "green";

            updateMap("green");

        }


        /* ---------- UPDATE ALERT ---------- */

        updateAlert(result);


    }

    catch(error){

        console.error(error);


        riskNumber.innerText =
            "--";


        riskStatus.innerHTML =
            "⚠️ BACKEND ERROR";


        riskStatus.style.background =
            "#3b1b1b";

        riskStatus.style.color =
            "#ff7777";


        riskMessage.innerText =
            "Unable to connect to PranaRaksha AI " +
            "backend. Please make sure index.py " +
            "is running.";

    }

}


/* =========================================================
   UPDATE ALERT MESSAGE
========================================================= */

function updateAlert(result){

    const notification =
        document.querySelector(".notification");


    if(!notification){
        return;
    }


    const heading =
        notification.querySelector("h3");


    const paragraphs =
        notification.querySelectorAll("p");


    if(result.color === "red"){

        heading.innerText =
            "⚠️ HIGH RISK ALERT";

        heading.style.color =
            "#ff5b5b";


        paragraphs[0].innerText =
            "High disaster risk conditions " +
            "have been detected based on the " +
            "current risk parameters.";


        paragraphs[1].innerText =
            "Please move towards the nearest " +
            "marked safe relocation centre.";

    }


    else if(result.color === "yellow"){

        heading.innerText =
            "🟡 MODERATE RISK ALERT";

        heading.style.color =
            "#ffe66d";


        paragraphs[0].innerText =
            "Moderate risk conditions have been " +
            "detected. Continue monitoring the area.";


        paragraphs[1].innerText =
            "Keep emergency preparations ready " +
            "and follow official instructions.";

    }


    else{

        heading.innerText =
            "🟢 LOWER RISK";

        heading.style.color =
            "#55e69a";


        paragraphs[0].innerText =
            "Current prototype risk indicator " +
            "shows lower risk conditions.";


        paragraphs[1].innerText =
            "Continue normal monitoring and " +
            "stay aware of local warnings.";

    }

}


/* =========================================================
   INITIALIZE
========================================================= */

updateSliderValues();

/* Initial map */

updateMap("yellow");


/* =========================================================
   SMOOTH NAVIGATION
========================================================= */

document.querySelectorAll(
    'a[href^="#"]'
).forEach(function(link){

    link.addEventListener(
        "click",
        function(e){

            const target =
                document.querySelector(
                    this.getAttribute("href")
                );


            if(target){

                e.preventDefault();


                target.scrollIntoView({
                    behavior: "smooth"
                });

            }

        }
    );

});


/* =========================================================
   MAP BUTTON
========================================================= */

document.getElementById(
    "riskSelector"
).addEventListener(
    "change",
    function(){

        updateMap(this.value);

    }
);

</script>
